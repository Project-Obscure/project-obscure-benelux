name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Validate specs
        run: python obscure.py validate
      - name: Test generated parsers (reference, ALEAPP/iLEAPP, AXIOM SQL, Cellebrite mock)
        run: python obscure.py test
      - name: Tool folders match the specs
        run: python obscure.py build --check
      - name: Installer runs
        run: python install.py list
